server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Route to index.html for all requests
    location / {
        try_files $uri /index.html;
    }

    # Don't cache index.html
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}